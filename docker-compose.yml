version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: vastrenix-postgres
    restart: always
    environment:
      POSTGRES_USER: vastrenix
      POSTGRES_PASSWORD: vastrenix_secure_password
      POSTGRES_DB: vastrenix_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: vastrenix-backend
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://vastrenix:vastrenix_secure_password@db:5432/vastrenix_db
      SECRET_KEY: vastrenix_production_secret_key_change_in_prod
      STORAGE_DIR: /app/storage
    ports:
      - "8000:8000"
    volumes:
      - storage_data:/app/storage

volumes:
  postgres_data:
  storage_data:
