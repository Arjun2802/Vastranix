<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="100%" height="100%">
  <defs>
    <!-- 3D V Left Wing Outer Facet -->
    <linearGradient id="vlLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>

    <!-- 3D V Left Inner Bevel -->
    <linearGradient id="vlLeftInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#042F2E" />
    </linearGradient>

    <!-- 3D V Right Wing Outer Facet -->
    <linearGradient id="vlRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- Gold Center Ribbon -->
    <linearGradient id="vlGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>

    <filter id="logoShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#192B3A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- 3D V Symbol (Scaled & Centered at X:15 Y:10 W:90 H:90) -->
  <g transform="translate(12, 10) scale(0.175)" filter="url(#logoShadow)">
    <rect width="512" height="512" rx="120" fill="#142430" />
    <path d="M120 110 L195 90 L256 360 L200 415 L100 150 Z" fill="url(#vlLeft)" />
    <path d="M195 90 L256 360 L256 415 L180 145 Z" fill="url(#vlLeftInner)" />
    <path d="M317 90 L392 110 L412 150 L256 415 L256 360 Z" fill="url(#vlRight)" />
    <path d="M256 360 L317 90 L275 145 L256 415 Z" fill="#042F2E" />
    <path d="M256 160 L276 270 L256 425 L236 270 Z" fill="url(#vlGold)" />
    <path d="M195 90 L256 360" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Wordmark "VASTRENIX" in Deep Navy -->
  <text x="122" y="58" font-family="'Manrope', 'Inter', sans-serif" font-size="34" font-weight="900" letter-spacing="4" fill="#192B3A">
    VASTRENIX
  </text>
  
  <!-- Sub-label descriptor -->
  <text x="124" y="80" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="2.5" fill="#218C82" text-transform="uppercase">
    Clothing Business Platform
  </text>
</svg>
