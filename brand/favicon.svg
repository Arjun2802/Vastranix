<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Vignette -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1E3345" />
      <stop offset="100%" stop-color="#0F1B24" />
    </radialGradient>

    <!-- 3D V Left Wing Outer Facet (Deep Rich Teal) -->
    <linearGradient id="vLeftOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="50%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>

    <!-- 3D V Left Wing Inner Bevel (Shaded Depth) -->
    <linearGradient id="vLeftInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="60%" stop-color="#115E59" />
      <stop offset="100%" stop-color="#042F2E" />
    </linearGradient>

    <!-- 3D V Right Wing Outer Facet (Vibrant Jewel Cyan-Teal) -->
    <linearGradient id="vRightOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4" />
      <stop offset="40%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- 3D V Right Wing Inner Shadow (Deep Dimension) -->
    <linearGradient id="vRightInner" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#134E4A" />
      <stop offset="60%" stop-color="#042F2E" />
      <stop offset="100%" stop-color="#021C1B" />
    </linearGradient>

    <!-- 3D Gold Accent Edge (Textile Heritage Thread) -->
    <linearGradient id="goldThread" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>

    <!-- Top Cap Bevels (Specularity) -->
    <linearGradient id="topBevelLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#99F6E4" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <linearGradient id="topBevelRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CCFBF1" />
      <stop offset="100%" stop-color="#5EEAD4" />
    </linearGradient>

    <!-- Drop Shadow Filter for 3D Floating Effect -->
    <filter id="dropShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#02151F" flood-opacity="0.65" />
    </filter>

    <filter id="innerGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff" />
      <feFlood flood-color="#FFFFFF" flood-opacity="0.3" />
      <feComposite in2="shadowDiff" operator="in" />
      <feComposite in2="SourceGraphic" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle Rim Light on Container -->
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

  <!-- 3D Geometric Isometric "V" Symbol -->
  <g filter="url(#dropShadow)">
    
    <!-- Deep Floor Shadow under the V vertex -->
    <ellipse cx="256" cy="428" rx="110" ry="24" fill="#030C12" opacity="0.6" filter="blur(8px)" />

    <!-- 1. LEFT ARM - Back/Under Shadow Facet -->
    <path d="M120 110 L195 90 L256 360 L220 395 Z" fill="#042F2E" opacity="0.85" />

    <!-- 2. RIGHT ARM - Back Shadow Facet -->
    <path d="M392 110 L317 90 L256 360 L292 395 Z" fill="#021C1B" opacity="0.95" />

    <!-- 3. LEFT WING - Inner Chiseled Fold -->
    <path d="M195 90 L256 360 L256 415 L180 145 Z" fill="url(#vLeftInner)" />

    <!-- 4. RIGHT WING - Inner Shaded Fold (Creates Dramatic Depth Intersection) -->
    <path d="M256 360 L317 90 L275 145 L256 415 Z" fill="url(#vRightInner)" />

    <!-- 5. LEFT WING - Main Front 3D Facet -->
    <path d="M120 110 L195 90 L256 360 L200 415 L100 150 Z" fill="url(#vLeftOuter)" />

    <!-- 6. RIGHT WING - Main Front 3D Facet (Light Catcher) -->
    <path d="M317 90 L392 110 L412 150 L256 415 L256 360 Z" fill="url(#vRightOuter)" />

    <!-- 7. CENTER 3D CREST RIBBON (The Gold Luxury Weaver Thread) -->
    <path d="M256 160 L276 270 L256 425 L236 270 Z" fill="url(#goldThread)" />

    <!-- 8. LEFT TOP CAP (Beveled Chamfer) -->
    <polygon points="120,110 100,150 175,130 195,90" fill="url(#topBevelLeft)" />

    <!-- 9. RIGHT TOP CAP (Beveled Chamfer) -->
    <polygon points="317,90 337,130 412,150 392,110" fill="url(#topBevelRight)" />

    <!-- 10. CRISP SPECULAR HIGHLIGHT ALONG LEFT 3D RIDGE -->
    <path d="M195 90 L256 360" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.85" />
    <path d="M120 110 L100 150" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.7" />

    <!-- 11. GOLD THREAD LIGHT GLINT (Vertex Accent) -->
    <circle cx="256" cy="425" r="7" fill="#FDE047" filter="drop-shadow(0 0 6px #FDE047)" />
  </g>
</svg>
