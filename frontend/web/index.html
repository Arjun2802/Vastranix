<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#101E2B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>VASTRENIX — Clothing Business Management Platform</title>
  <link rel="icon" type="image/svg+xml" href="static/brand/favicon.svg">
  <link rel="stylesheet" href="static/css/vastrenix.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- Immediate branded textile splash screen so screen is never blank -->
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #FAF8F3 url('static/images/textile-doodles.svg') repeat; font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;">
      <img src="static/brand/vastrenix-icon.svg" alt="VASTRENIX 3D V" style="width: 96px; height: 96px; margin-bottom: 16px; filter: drop-shadow(0 14px 28px rgba(25, 43, 58, 0.22));">
      <h1 style="font-size: 26px; font-weight: 900; letter-spacing: 3px; color: #192B3A; margin: 0 0 6px 0;">VASTRENIX</h1>
      <p style="color: #218C82; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; margin: 0 0 24px 0;">Your Business, Beautifully in Sync.</p>
      <div style="font-size: 12px; color: #697782; font-weight: 500;">Initializing business workspace...</div>
    </div>
  </div>
  <script src="static/js/vastrenix.js"></script>
</body>
</html>
