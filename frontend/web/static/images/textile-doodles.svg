<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" fill="none" stroke="#192B3A" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.035">
  <!-- Subtle Airy Boutique Textile Weave & Tailoring Texture (3.5% Opacity) -->
  
  <!-- 1. Tailor Scissors (Top Left) -->
  <g transform="translate(60, 50) scale(0.7)">
    <circle cx="16" cy="40" r="10" stroke-width="0.9" />
    <circle cx="44" cy="40" r="10" stroke-width="0.9" />
    <path d="M22 34 L50 4" />
    <path d="M38 34 L10 4" />
    <circle cx="30" cy="22" r="1.5" fill="#192B3A" />
  </g>

  <!-- 2. Sewing Needle & Delicate Thread (Top Right) -->
  <g transform="translate(420, 70) scale(0.75)">
    <path d="M40 5 L85 50" stroke-width="0.9" />
    <line x1="82" y1="47" x2="86" y2="51" stroke-width="0.9" />
    <ellipse cx="44" cy="9" rx="2" ry="1" transform="rotate(45 44 9)" stroke-width="0.7" />
    <path d="M42 7 C25 -5, 10 15, 25 25 C40 35, 20 50, 5 45" stroke-dasharray="2 3" stroke-width="0.7" />
  </g>

  <!-- 3. Minimal Thread Spool (Center Left) -->
  <g transform="translate(90, 320) scale(0.65)">
    <path d="M10 5 L40 5 L35 15 L35 45 L40 55 L10 55 L15 45 L15 15 Z" stroke-width="0.9" />
    <line x1="16" y1="20" x2="34" y2="20" stroke-dasharray="1 2" />
    <line x1="15" y1="26" x2="35" y2="26" />
    <line x1="15" y1="32" x2="35" y2="32" />
    <line x1="16" y1="38" x2="34" y2="38" stroke-dasharray="1 2" />
  </g>

  <!-- 4. Garment Hanger (Center Right) -->
  <g transform="translate(430, 310) scale(0.7)">
    <path d="M35 15 C35 5, 45 5, 45 15 C45 22, 40 25, 40 30" stroke-width="0.9" />
    <path d="M40 30 L5 55 L75 55 Z" stroke-width="0.9" />
    <line x1="10" y1="55" x2="70" y2="55" stroke-width="0.8" />
  </g>

  <!-- 5. Tailor Button (Bottom Center) -->
  <g transform="translate(260, 480) scale(0.7)">
    <circle cx="25" cy="25" r="16" stroke-width="0.9" />
    <circle cx="20" cy="20" r="1.5" fill="#192B3A" />
    <circle cx="30" cy="20" r="1.5" fill="#192B3A" />
    <circle cx="20" cy="30" r="1.5" fill="#192B3A" />
    <circle cx="30" cy="30" r="1.5" fill="#192B3A" />
    <line x1="20" y1="20" x2="30" y2="30" stroke-width="0.8" />
    <line x1="30" y1="20" x2="20" y2="30" stroke-width="0.8" />
  </g>

  <!-- 6. Very faint stitched seam guide -->
  <path d="M0 180 Q150 200 300 170 T600 190" stroke-dasharray="3 5" stroke-width="0.6" />
  <path d="M0 430 Q150 410 300 440 T600 420" stroke-dasharray="3 5" stroke-width="0.6" />
</svg>